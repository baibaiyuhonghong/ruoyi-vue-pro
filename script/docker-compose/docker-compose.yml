# 芋道前后端 Docker Compose 编排（单体版）
#
# 目标：在一台已安装 Docker Engine + Docker Compose V2 的机器上，快速拉起
#       MySQL、Redis、yudao-server（后端）与前端 Nginx，组成一套可登录的体验环境。
#
# 使用前必读：
#   1. 需要 Docker Compose V2.20.2 及以上版本（使用 `docker compose` 命令，而非老的 `docker-compose`）。
#   2. 需要先在源码根目录执行 `mvn clean package -pl yudao-server -am -Dmaven.test.skip=true`
#      生成 yudao-server/target/yudao-server.jar，本文件 build 时会由 yudao-server/Dockerfile 复制该 Jar。
#   3. 需要先把前端打包产物（dist 目录中的全部文件，包含 index.html）复制到 ./web/dist/。
#      前端生产配置应使用同源地址（例如 http://localhost:8080 或部署域名），
#      不要写 yudao-server、127.0.0.1:48080 等容器名或后端端口；API 路径为 /admin-api。
#   4. 复制 .env.example 为 .env，并替换其中的示例密码后再启动。
#
# 常用命令（均在本目录执行）：
#   docker compose config          # 校验并预览最终配置，变量缺失会直接报错
#   docker compose up -d --build   # 构建后端镜像并启动全部服务
#   docker compose logs -f yudao-server
#   docker compose down            # 停止并删除容器（保留数据卷）
#
# 注意：不要执行 `docker compose down -v`，它会删除 MySQL、Redis 数据卷。

name: yudao-boot

services:
  mysql:
    image: mysql:8.4
    container_name: yudao-boot-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 仅在数据卷为空、首次初始化时生效；启动后修改 .env 不会同步修改库内账号密码。
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ruoyi-vue-pro}
      MYSQL_USER: ${MYSQL_USER:-yudao}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
    # 默认不映射到宿主机，避免与本机已有的 3306 冲突；需要直连时取消下一行注释。
    # ports:
    #   - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 仅首次初始化（数据卷为空）时按文件名顺序执行；已有数据卷后修改 SQL 不会重复执行。
      - type: bind
        source: ../../sql/mysql/ruoyi-vue-pro.sql
        target: /docker-entrypoint-initdb.d/10-ruoyi-vue-pro.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../sql/mysql/quartz.sql
        target: /docker-entrypoint-initdb.d/20-quartz.sql
        read_only: true
        bind:
          create_host_path: false
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    container_name: yudao-boot-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
    # 默认不映射到宿主机，避免与本机已有的 6379 冲突；需要直连时取消下一行注释。
    # ports:
    #   - "6379:6379"
    volumes:
      - redis-data:/data
    # 通过环境变量把密码传给 redis-server，避免把真实密码直接写进编排文件。
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  yudao-server:
    build:
      context: ../../yudao-server
      dockerfile: Dockerfile
    image: yudao-server:${IMAGE_TAG:-local}
    container_name: yudao-boot-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx512m -Djava.security.egd=file:/dev/./urandom}
      # 覆盖 application-dev.yaml 中的本地地址，使其指向同一 Compose 网络内的服务名。
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-ruoyi-vue-pro}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_USERNAME: ${MYSQL_USER:-yudao}
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_SLAVE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-ruoyi-vue-pro}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_SLAVE_USERNAME: ${MYSQL_USER:-yudao}
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_SLAVE_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
      YUDAO_CAPTCHA_ENABLE: ${YUDAO_CAPTCHA_ENABLE:-true}
    # 默认不映射到宿主机，前端请求统一经 web（Nginx）反向代理；需要直调后端时取消注释。
    # ports:
    #   - "48080:48080"

  web:
    image: nginx:1.28-alpine
    container_name: yudao-boot-web
    restart: unless-stopped
    depends_on:
      - yudao-server
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - type: bind
        source: ./web/dist
        target: /usr/share/nginx/html
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false

volumes:
  mysql-data:
    name: yudao-boot_mysql-data
  redis-data:
    name: yudao-boot_redis-data
