spring:
  main:
    lazy-initialization: true
    banner-mode: off
  datasource:
    name: yudao-module-book
    url: jdbc:h2:mem:book;MODE=MYSQL;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
  sql:
    init:
      schema-locations: classpath:/sql/create_tables.sql
      encoding: UTF-8

mybatis-plus:
  lazy-initialization: true

yudao:
  info:
    base-package: cn.iocoder.yudao
